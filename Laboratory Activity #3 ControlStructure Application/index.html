<!DOCTYPE html>
<html lang = "en">
   <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <title>Mini Store Checkout System</title>
   </head>
   <body>
       <form id = "form">
          <label for = "customerName">Customer Name:</label>
          <input type = "text" id = "customerName" name = "customerName" required><br>
          <label for = "productCount">Number of products:</label>
          <input type = "text" id = "productCount" name = "productCount" required></form><br>
          <label for = "deliveryOption">Delivery Options</label>
          <select id = "deliveryOption">
               <option value = "1">Store Pickup [Free]</option>
               <option value = "2">Standard Delivery [$2.00]</option>
               <option value = "3">Express Delivery [$4.00]</option>
          </select><br>
          <button id = "btn">Submit</button>
       </form>

       <h3 id = "productsContainer"></h3>

       <button id = "calculatebtn">Calculate Total</button>
      <p id = "validationMessage"></p>
      <p id = "orderSummary"></p>
   </body>
   <script src = "script.js"></script>
</html>
