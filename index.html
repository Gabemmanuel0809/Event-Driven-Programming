<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Debugging Exercise</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <h1 id="mainHeading">Event-Driven Webpage</h1>

        <label for="nameInput">Enter your name:</label>
        <input type="text" id="nameInput" placeholder="Type your name">

        <p id="typingMessage">You are typing:</p>

        <div class="button-group">
            <button id="greetButton">Display Greeting</button>
            <button id="colorButton">Change Background</button>
            <button id="resetButton">Reset</button>
        </div>

        <p id="resultMessage">Enter your name and select an action.</p>
    </main>
	<script src="script.js"></script>
</body>
</html>
